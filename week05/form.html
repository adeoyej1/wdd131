<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Product review form for sharing your experience with a product.">
  <meta name="author" content="John Adeoye">
  <title>Product Review | WDD 131</title>
  <link rel="stylesheet" href="styles/form.css">
  <script src="scripts/form.js" defer></script>
</head>
<body>
  <header>
    <h1>Product Review</h1>
    <p>Share your experience and help others choose the right product.</p>
  </header>

  <main>
    <form method="get" action="review.html">
      <fieldset>
        <legend>Product Information</legend>

        <div class="form-group">
          <label for="product">Product Name <span class="required">*</span></label>
          <select id="product" name="product" required>
            <option value="" disabled selected>Select a Product ...</option>
          </select>
        </div>

        <div class="form-group">
          <fieldset class="rating-fieldset">
            <legend>Overall Rating <span class="required">*</span></legend>
            <div class="rating-options">
              <div>
                <input type="radio" id="rating1" name="rating" value="1" required>
                <label for="rating1" aria-label="1 star">&#9734;</label>
              </div>
              <div>
                <input type="radio" id="rating2" name="rating" value="2">
                <label for="rating2" aria-label="2 stars">&#9734;</label>
              </div>
              <div>
                <input type="radio" id="rating3" name="rating" value="3">
                <label for="rating3" aria-label="3 stars">&#9734;</label>
              </div>
              <div>
                <input type="radio" id="rating4" name="rating" value="4">
                <label for="rating4" aria-label="4 stars">&#9734;</label>
              </div>
              <div>
                <input type="radio" id="rating5" name="rating" value="5">
                <label for="rating5" aria-label="5 stars">&#9734;</label>
              </div>
            </div>
          </fieldset>
        </div>

        <div class="form-group">
          <label for="installation-date">Date of Installation <span class="required">*</span></label>
          <input type="date" id="installation-date" name="installation-date" required>
        </div>
      </fieldset>

      <fieldset>
        <legend>Review Details</legend>

        <div class="form-group">
          <span class="field-label">Useful Features</span>
          <div class="checkbox-group">
            <label><input type="checkbox" id="feature-durability" name="features" value="Durability"> Durability</label>
            <label><input type="checkbox" id="feature-ease" name="features" value="Ease of use"> Ease of use</label>
            <label><input type="checkbox" id="feature-performance" name="features" value="Performance"> Performance</label>
            <label><input type="checkbox" id="feature-design" name="features" value="Design"> Design</label>
            <label><input type="checkbox" id="feature-value" name="features" value="Value for money"> Value for money</label>
          </div>
        </div>

        <div class="form-group">
          <label for="written-review">Written Review</label>
          <textarea id="written-review" name="written-review" rows="6" placeholder="Tell us what you liked or what could be improved."></textarea>
        </div>

        <div class="form-group">
          <label for="user-name">Your Name <span class="optional">(optional)</span></label>
          <input type="text" id="user-name" name="user-name" autocomplete="name" placeholder="Enter your name">
        </div>
      </fieldset>

      <input class="submit-button" type="submit" value="Submit Review">
    </form>
  </main>

  <footer>
    <p>&copy; <span id="currentyear"></span> John Adeoye | Nigeria</p>
    <p>Last Modified: <span id="lastModified"></span></p>
  </footer>
</body>
</html>
