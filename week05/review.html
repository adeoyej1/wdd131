<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Confirmation page for a submitted product review.">
  <meta name="author" content="John Adeoye">
  <title>Review Submitted | WDD 131</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles/form.css">
  <script src="scripts/form.js" defer></script>
  
</head>
<body>
  <header>
    <h1>Review Submitted</h1>
    <p>Thank you for taking the time to share your experience.</p>
  </header>

  <main>
    <section class="confirmation-card" aria-labelledby="confirmation-title">
      <div class="success-icon" aria-hidden="true">&#10003;</div>
      <h2 id="confirmation-title">Thank You!</h2>
      <p>Your product review has been successfully submitted.</p>

      <div id="review-summary" class="review-summary"></div>

      <p class="review-count">You have completed <strong id="review-count">0</strong> review(s).</p>
      <a class="back-link" href="form.html">Write Another Review</a>
    </section>
  </main>

  <footer>
    <p>&copy; <span id="currentyear"></span> John Adeoye | Nigeria</p>
    <p>Last Modified: <span id="lastModified"></span></p>
  </footer>
</body>
</html>
